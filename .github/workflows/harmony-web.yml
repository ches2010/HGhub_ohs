name: Harmony web bundle

# 目的：把前端构建产物提交进仓库，让 harmony/ 下的 HAP 工程自包含
# （否则 rawfile/www 是空的，装机必然白屏）。
# 只在手动触发时运行，避免和上游 release/ci 工作流打架，也不会形成提交循环。

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 打补丁（幂等）
        run: node harmony/patches/apply-patch.mjs .

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建前端
        run: pnpm build

      - name: 同步到 rawfile/www
        run: |
          set -euo pipefail
          DEST=harmony/entry/src/main/resources/rawfile/www
          test -f dist/index.html
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -r dist/. "$DEST/"
          echo "文件数：$(find "$DEST" -type f | wc -l | tr -d ' ')"
          ls -1 "$DEST" | head -10

      - name: 提交产物
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # www 被 .gitignore 排除，这里强制加入（此后这些文件就是被跟踪状态）
          git add -f harmony/entry/src/main/resources/rawfile/www
          if git diff --cached --quiet; then
            echo "产物没有变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(harmony): 同步前端产物到 rawfile/www（CI 构建）"
          git push
