name: Harmony release

# 打 v* tag 或手动触发：构建 unsigned HAP 并发布到 GitHub Release。
#
# 签名说明：harmony/build-profile.json5 的 signingConfigs 为空数组，
# assembleHap 产出 unsigned HAP，本流程刻意不做签名。
# 真机安装请用 DevEco Studio 自动签名，或下载后在本地用 hap-sign-tool 签名。
#
# 依赖仓库自带的 harmony/scripts/build-hap.sh（自动定位 hvigorw / SDK / node）。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "发版 tag（如 v2.2.5）：用于命名 Release 与产物；留空则只出 artifact 不发布"
        type: string
        default: ""
      prerelease:
        description: "标记为 Pre-release（预发布）"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: harmony-release-${{ github.ref }}
  cancel-in-progress: false

env:
  # HarmonyOS command-line-tools（Linux x64，内含 hvigorw / ohpm / SDK）。
  # 官方下载页需登录：https://developer.huawei.com/consumer/cn/download/command-line-tools-for-hmos
  # 默认用 HuggingFace 镜像（csukuangfj 转存的官方原包）；失效时换成官方直链或新版本号。
  CLI_ZIP_URL: https://huggingface.co/csukuangfj/harmonyos-commandline-tools/resolve/main/commandline-tools-linux-x64-6.0.1.251.zip
  CLI_CACHE_KEY: harmony-cli-6.0.1.251

jobs:
  build:
    name: Build unsigned HAP
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # hvigor 6.x 需要 JDK 17
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # 与 harmony-web-bundle.yml 保持一致：先 TV 版再标准版，标准版进包
      - name: Build frontend & sync into rawfile/www
        run: |
          VITE_APP_EDITION=tv pnpm build
          pnpm build
          DEST="harmony/entry/src/main/resources/rawfile/www"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -r dist/. "$DEST/"

      - name: Cache command-line-tools zip
        id: cli-cache
        uses: actions/cache@v4
        with:
          path: ~/harmony-cli.zip
          key: ${{ env.CLI_CACHE_KEY }}

      - name: Download command-line-tools
        if: steps.cli-cache.outputs.cache-hit != 'true'
        run: |
          curl -fL --retry 3 --connect-timeout 30 -o ~/harmony-cli.zip "$CLI_ZIP_URL"

      - name: Unpack command-line-tools
        run: |
          unzip -q ~/harmony-cli.zip -d "$HOME"
          HVIGORW_PATH="$(find "$HOME" -maxdepth 4 -type f -name hvigorw -path '*/hvigor/bin/*' | head -1)"
          if [ -z "$HVIGORW_PATH" ]; then
            echo "::error::解压后找不到 hvigor/bin/hvigorw，检查 CLI_ZIP_URL 包内容"
            exit 1
          fi
          CLI_DIR="$(cd "$(dirname "$(dirname "$(dirname "$HVIGORW_PATH")")")" && pwd)"
          chmod +x "$CLI_DIR/hvigor/bin/hvigorw" 2>/dev/null || true
          echo "HARMONY_CLI_HOME=$CLI_DIR" >> "$GITHUB_ENV"
          echo "command-line-tools: $CLI_DIR"

      - name: ohpm install
        run: |
          export PATH="$HARMONY_CLI_HOME/ohpm/bin:$PATH"
          ohpm install --all
        working-directory: harmony

      - name: Build HAP (unsigned)
        run: bash harmony/scripts/build-hap.sh --mode module -p module=entry@default -p product=default assembleHap

      - name: Collect HAP artifact
        id: collect
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          V="${TAG#v}"
          SRC="$(find harmony/entry/build -type f -name '*-unsigned.hap' | head -1)"
          if [ -z "$SRC" ]; then
            echo "::error::没有找到 unsigned HAP"
            find harmony/entry/build -type f | head -50
            exit 1
          fi
          mkdir -p artifacts
          cp "$SRC" "artifacts/HGhubX_ohs_${V}_unsigned.hap"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          ls -lh artifacts

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: harmony-hap-unsigned
          path: artifacts/*
          retention-days: 14
          if-no-files-found: error

      - name: Resolve release notes
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        id: notes
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          F="docs/release-notes/${TAG}.md"
          if [ -f "$F" ]; then
            echo "body_path=$F" >> "$GITHUB_OUTPUT"
            echo "使用 $F"
          else
            echo "body_path=" >> "$GITHUB_OUTPUT"
            echo "没有 $F，回退自动生成的说明"
          fi

      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        with:
          tag_name: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
          name: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
          body_path: ${{ steps.notes.outputs.body_path }}
          files: artifacts/*
          generate_release_notes: ${{ steps.notes.outputs.body_path == '' }}
          prerelease: ${{ inputs.prerelease || contains(inputs.tag != '' && inputs.tag || github.ref_name, '-') }}
          fail_on_unmatched_files: true
